# ==============================================================================
# Mắt Phố - Autonomous Edge Node (Docker Compose Stack)
# Services:
#   1. mediamtx     : RTSP (:8554), Low-Latency HLS (:8888/live/{cam_id}/index.m3u8), WebRTC (:8889)
#   2. edge-backend : RTSP Input -> H.264 -> HLS Publisher + LAN Probe + SQLite WAL + Cloud WS
#   3. firewatch-ai : Clean AI Skeleton (1 RTSP Input + 1 Webhook Output) for AI Team
#   4. mock-camera  : (Tùy chọn --profile mock) Giả lập camera OSD bơm vào rtsp://mediamtx:8554/mock/cam_test
# ==============================================================================

networks:
  edge-net:
    driver: bridge
    name: matpho_edge_net

volumes:
  edge_local_data:
    name: matpho_edge_local_data

services:
  # ----------------------------------------------------------------------------
  # 1. Local MediaMTX: Edge Stream Gateway (RTSP Ingest & Low-Latency HLS Server)
  # ----------------------------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: matpho_edge_mediamtx
    restart: unless-stopped
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"       # RTSP Ingest & Local Proxy for AI (rtsp://mediamtx:8554/live/{cam_id})
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"       # HLS Playback for App (http://localhost:8888/live/{cam_id}/index.m3u8)
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"       # WebRTC / WHEP Playback
      - "${MEDIAMTX_API_PORT:-9997}:9997"       # MediaMTX Control REST API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - edge-net

  # ----------------------------------------------------------------------------
  # 2. Edge Backend: RTSP -> HLS Stream Worker, LAN Probe, SQLite WAL & Cloud WS
  # ----------------------------------------------------------------------------
  edge-backend:
    build:
      context: ./edge_backend
      dockerfile: Dockerfile
    container_name: matpho_edge_backend
    restart: unless-stopped
    ports:
      - "${EDGE_BACKEND_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      - EDGE_DEVICE_ID=${EDGE_DEVICE_ID:-edg_local_01}
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - MEDIAMTX_HLS_URL=${MEDIAMTX_HLS_URL:-http://localhost:8888}
      - PATH_SOURCE_TEMPLATE=${PATH_SOURCE_TEMPLATE:-source/{cam_id}}
      - PATH_APP_TEMPLATE=${PATH_APP_TEMPLATE:-live/{cam_id}}
      - PATH_AI_TEMPLATE=${PATH_AI_TEMPLATE:-ai/{cam_id}}
      - ENABLE_AI_BRANCH=${ENABLE_AI_BRANCH:-false}
      - CLOUD_BACKEND_WS_URL=${CLOUD_BACKEND_WS_URL:-ws://host.docker.internal:8000/api/v1/internal/edge/ws}
      - CLOUD_BACKEND_API_URL=${CLOUD_BACKEND_API_URL:-http://host.docker.internal:8000}
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY:-secure_internal_key_for_ai_and_worker_communication}
      - EDGE_SQLITE_PATH=/app/data/edge_local.db
      - 'DECODER_STREAMS=${DECODER_STREAMS:-[{"cam_id": "cam_01", "source_url": "rtsp://mediamtx:8554/mock/cam_test"}]}'
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - edge_local_data:/app/data
    depends_on:
      mediamtx:
        condition: service_started
    networks:
      - edge-net

  # ----------------------------------------------------------------------------
  # 3. FireWatch AI Service: Clean Plug-and-Play Skeleton (1 Input RTSP + 1 Output Webhook)
  # ----------------------------------------------------------------------------
  firewatch-ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: matpho_edge_firewatch_ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EDGE_DEVICE_ID=${EDGE_DEVICE_ID:-edg_local_01}
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - STREAM_PATH_TEMPLATE=${STREAM_PATH_TEMPLATE:-live/{cam_id}}
      - CLOUD_BACKEND_API_URL=${CLOUD_BACKEND_API_URL:-http://host.docker.internal:8000}
      - EDGE_BACKEND_API_URL=http://edge-backend:8090
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY:-secure_internal_key_for_ai_and_worker_communication}
      - 'AI_CAMERA_STREAMS=${AI_CAMERA_STREAMS:-[{"cam_id": "cam_01"}]}'
      - AI_TARGET_FPS=${AI_TARGET_FPS:-3.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./ai_service/weights:/app/weights:ro
    depends_on:
      mediamtx:
        condition: service_started
      edge-backend:
        condition: service_started
    networks:
      - edge-net

  # ----------------------------------------------------------------------------
  # 4. Mock Camera Simulator (Optional Demo Profile: --profile mock)
  # ----------------------------------------------------------------------------
  mock-camera:
    build:
      context: ./edge_backend
      dockerfile: Dockerfile
    container_name: matpho_edge_mock_camera
    restart: unless-stopped
    command: ["python", "/app/scripts/mock_camera.py", "--url", "rtsp://mediamtx:8554/mock/cam_test"]
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      mediamtx:
        condition: service_started
    networks:
      - edge-net
    profiles:
      - mock
      - demo

  # ----------------------------------------------------------------------------
  # 5. Edge HTTPS Gateway: Cloudflare Outbound Tunnel for HLS (:8888) & WebRTC (:8889)
  #    Zero-NAT Port Forwarding - Exposes HLS over HTTPS to Internet (Profile: --profile gateway)
  # ----------------------------------------------------------------------------
  edge-gateway:
    image: cloudflare/cloudflared:latest
    container_name: matpho_edge_gateway
    restart: unless-stopped
    command: tunnel --no-autoupdate --logfile /app/data/tunnel.log --url http://mediamtx:8888
    volumes:
      - edge_local_data:/app/data
    depends_on:
      mediamtx:
        condition: service_started
    networks:
      - edge-net
    profiles:
      - gateway
      - tunnel
      - prod
