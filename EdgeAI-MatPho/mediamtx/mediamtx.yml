###############################################
# MediaMTX Configuration - Edge Stream Gateway
# Standardized Stream Path: live/{cam_id}
# - Input RTSP : Pushed by edge-backend (from LAN IP Camera or mock/cam_test)
# - Output HLS : http://<edge>:8888/live/{cam_id}/index.m3u8 (for Mobile/Web App)
# - Output RTSP: rtsp://mediamtx:8554/live/{cam_id} (for AI Service Input)
###############################################

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: yes

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'

paths:
  # 1. Mock Camera Source (pushed by scripts/mock_camera.py)
  mock/cam_test:
    source: publisher

  # 2. Standalone Direct Alias (optional zero-copy test without edge-backend)
  live/cam_mock:
    source: rtsp://localhost:8554/mock/cam_test
    sourceOnDemand: no

  # 3. All active cameras (e.g. live/cam_01, live/{cam_id} published by edge-backend)
  all_others:
    source: publisher
