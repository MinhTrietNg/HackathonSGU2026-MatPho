[project]
name = "firewatch"
version = "3.0.0"
description = "FireWatch v3 - phát hiện cháy/khói xe từ camera giám sát (dự án Mắt Phố)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4,<9",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "onnxruntime>=1.18",
    "onnx>=1.16",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
firewatch = "firewatch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firewatch = ["static/*.html"]   # trang /console

[tool.pytest.ini_options]
testpaths = ["tests"]
