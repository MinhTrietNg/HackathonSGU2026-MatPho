<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mắt Phố — Console người trực</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --ink: #161616; --muted: #5d5b56;
    --line: #dddad3; --crit: #c62828; --warn: #e07b00; --ok: #2e7d32;
    --info: #1f5fbf; --suppr: #757575; --flash: #fff3cd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1f1f1f; --ink: #f1f0ec; --muted: #a9a69f;
      --line: #34322e; --flash: #4a3b0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 16px; border-bottom: 1px solid var(--line);
           background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; }
  #conn { font-size: 13px; padding: 2px 8px; border-radius: 99px;
          background: var(--suppr); color: #fff; }
  #conn.on { background: var(--ok); }
  #meta { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { padding: 16px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; display: flex;
          flex-direction: column; }
  .card.crit { border-left: 6px solid var(--crit); }
  .card.warn { border-left: 6px solid var(--warn); }
  .card.flash { animation: flash 2.5s ease-out; }
  @keyframes flash {
    from { background: var(--flash); } to { background: var(--card); }
  }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain;
              background: #000; display: block; }
  .body { padding: 12px; display: grid; gap: 8px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .b { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
       color: #fff; background: var(--suppr); }
  .b.CRITICAL { background: var(--crit); } .b.WARNING { background: var(--warn); }
  .b.VERIFIED { background: var(--ok); } .b.UNVERIFIED { background: var(--info); }
  .b.CONTROLLED { background: #6a4caf; } .b.UNCONTROLLED { background: var(--crit); }
  .b.light { background: transparent; color: var(--muted);
             border: 1px solid var(--line); }
  .b.esc { background: #000; }
  .desc { margin: 0; font-size: 15px; }
  .time { color: var(--muted); font-size: 13px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button { font: inherit; font-size: 14px; padding: 9px 6px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink);
           cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.confirm { background: var(--crit); color: #fff; border-color: var(--crit); }
  button.dismiss { background: #6a4caf; color: #fff; border-color: #6a4caf; }
  button:disabled { opacity: .5; cursor: default; }
  input.note { font: inherit; padding: 7px 8px; border-radius: 8px; width: 100%;
               border: 1px solid var(--line); background: var(--bg);
               color: var(--ink); }
  .ack { font-size: 14px; font-weight: 600; }
  .ack.confirm { color: var(--crit); } .ack.dismiss_controlled { color: #6a4caf; }
  .ack.watch { color: var(--info); }
  .empty { color: var(--muted); padding: 32px; text-align: center;
           grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Mắt Phố — Console người trực</h1>
  <span id="conn">mất kết nối</span>
  <span id="meta"></span>
</header>
<main id="list"><p class="empty">Chưa có cảnh báo.</p></main>
<script>
"use strict";
const ACTIONS = {
  confirm: "Xác nhận sự cố",
  dismiss_controlled: "Bỏ qua — lửa có kiểm soát",
  watch: "Theo dõi",
};
const CTX = { HAM: "Hầm xe", TRET: "Tầng trệt", NGOAI: "Ngoài trời" };
const events = new Map();   // event_id -> {event, status, escalations}
const acks = new Map();     // event_id -> ack
const list = document.getElementById("list");

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function snapshotUrl(path) {
  return path ? "/snapshots/" + encodeURIComponent(path.split("/").pop()) : "";
}

function badge(text, cls) { return el("span", { class: "b " + (cls || "") }, text); }

function render(id) {
  const item = events.get(id);
  const ev = item.event;
  const vlm = ev.vlm || {};
  const ack = acks.get(id);
  const card = el("article", {
    class: "card " + (ev.severity === "CRITICAL" ? "crit" : "warn"), id: "ev-" + id });
  if (ev.snapshot_path) {
    card.append(el("img", { src: snapshotUrl(ev.snapshot_path), alt: "ảnh cảnh báo" }));
  }
  const badges = el("div", { class: "badges" },
    badge(ev.severity, ev.severity),
    badge(ev.verification, ev.verification),
    badge(CTX[ev.context] || ev.context, "light"),
    vlm.fire_type ? badge(vlm.fire_type, vlm.fire_type) : null,
    badge(item.status === "created" ? "mới" : "cập nhật", "light"),
    item.escalations ? badge("nhắc lại ×" + item.escalations, "esc") : null);
  const when = new Date(ev.started_at).toLocaleTimeString("vi-VN");
  const body = el("div", { class: "body" }, badges,
    el("p", { class: "desc" }, vlm.description_vi || "Chưa có mô tả xác minh."),
    el("div", { class: "time" }, `${ev.camera_id} · ${when} · video ` +
       `${ev.video_ts_sec}s · ${ev.event_id.slice(0, 8)}`));
  if (ack) {
    body.append(el("div", { class: "ack " + ack.action },
      "Đã xử lý: " + ACTIONS[ack.action] + (ack.note ? " — " + ack.note : "") +
      " (" + new Date(ack.acked_at).toLocaleTimeString("vi-VN") + ")"));
  }
  const note = el("input", { class: "note", placeholder: "Ghi chú (không bắt buộc)",
                             maxlength: "500" });
  const btn = (action, cls) => el("button", {
    class: cls, onclick: () => sendAck(id, action, note.value) }, ACTIONS[action]);
  body.append(note, el("div", { class: "actions" },
    btn("confirm", "confirm"), btn("dismiss_controlled", "dismiss"),
    btn("watch", "")));
  card.append(body);
  return card;
}

function draw(id, flash) {
  const card = render(id);
  if (flash) card.classList.add("flash");
  const old = document.getElementById("ev-" + id);
  if (old) old.replaceWith(card);
  else {
    list.querySelector(".empty")?.remove();
    list.prepend(card);
  }
  document.getElementById("meta").textContent =
    `${events.size} cảnh báo · ${acks.size} đã xử lý`;
}

async function sendAck(id, action, note) {
  const res = await fetch(`/events/${id}/ack`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, note }) });
  if (!res.ok) { alert("Không gửi được: HTTP " + res.status); return; }
  acks.set(id, await res.json());
  draw(id, false);
}

async function loadInitial() {
  const [evs, ak] = await Promise.all([
    fetch("/events?limit=30").then(r => r.json()),
    fetch("/acks").then(r => r.json())]);
  for (const [k, v] of Object.entries(ak)) acks.set(k, v);
  for (const ev of evs.reverse()) {
    events.set(ev.event_id, { event: ev, status: "created", escalations: 0 });
    draw(ev.event_id, false);
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  const conn = document.getElementById("conn");
  ws.onopen = () => { conn.textContent = "trực tuyến"; conn.classList.add("on"); };
  ws.onclose = () => {
    conn.textContent = "mất kết nối"; conn.classList.remove("on");
    setTimeout(connect, 2000);
  };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "event" || msg.type === "event_update") {
      const id = msg.event.event_id;
      const prev = events.get(id);
      events.set(id, {
        event: msg.event,
        status: msg.type === "event" ? "created" : "updated",
        escalations: (prev ? prev.escalations : 0) +
                     (msg.reason === "escalation" ? 1 : 0) });
      draw(id, true);
    } else if (msg.type === "ack") {
      acks.set(msg.ack.event_id, msg.ack);
      if (events.has(msg.ack.event_id)) draw(msg.ack.event_id, false);
    }
  };
}

loadInitial().catch(() => {}).finally(connect);
</script>
</body>
</html>
